name: "Publish Docker Image"
on:
  workflow_run:
    workflows: [ "Go Build & Test" ]
    branches: [ master ]
    types: [ completed ]
jobs:
  Publish_Docker_Image:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set Parameters
        id: params
        run: |
          echo "date=$(date +%Y-%m-%d-%H-%M)" >> $GITHUB_OUTPUT
          echo "shortRef=$(head -c 7 <<< '${{ forgejo.sha }}')" >> $GITHUB_OUTPUT

      - name: Login to Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.CODEBERG_USER }}
          password: ${{ secrets.CODEBERG_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v4.4.1
        with:
          platforms: linux/amd64,linux/arm64/v8

      - name: Build and Push
        uses: docker/build-push-action@v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}
        with:
          context: .
          file: ./build/package/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: "ghcr.io/alexswilliams/prom-trmnl-renderer:${{ forgejo.ref_name }}--${{ steps.params.outputs.date }}--${{ steps.params.outputs.shortRef }}"
