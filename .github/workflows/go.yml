name: "Go Build & Test"
on: [ push ]
jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Set up Go"
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
      - name: "Install Dependencies"
        run: make deps
      - name: "Build"
        run: make bin/main
